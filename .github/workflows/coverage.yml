name: Code Coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v6
    
    - name: Install LLVM and Clang
      run: |
        sudo apt-get update
        sudo apt-get install -y llvm clang
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: llvm-tools-preview
    
    - name: Install cargo-llvm-cov and cargo-nextest
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-llvm-cov,nextest

    # Interactive tests drive real bash and zsh and fail (not skip) if absent.
    - name: Ensure zsh is available
      run: which zsh || (sudo apt-get update && sudo apt-get install -y zsh)

    # nextest runs each test in its own process, matching the main test job;
    # libtest's shared-process model is not what the suite is written for.
    - name: Generate code coverage
      run: |
        export CC=clang
        export CXX=clang++
        export LLVM_PROFILE_FILE="pxhist-%p-%m.profraw"
        cargo llvm-cov nextest --all-features --workspace --include-ffi --lcov --output-path lcov.info

    - name: Enforce coverage floor
      run: cargo llvm-cov report --include-ffi --fail-under-lines 80
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: ./lcov.info
        fail_ci_if_error: false
        verbose: true
        token: ${{ secrets.CODECOV_TOKEN }}
    
    - name: Archive code coverage results
      uses: actions/upload-artifact@v7
      with:
        name: code-coverage-report
        path: lcov.info
        retention-days: 30