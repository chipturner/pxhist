name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Install cargo-nextest
      uses: taiki-e/install-action@nextest

    # Interactive tests drive real bash and zsh and fail (not skip) if absent.
    - name: Ensure zsh is available
      if: runner.os == 'Linux'
      run: which zsh || (sudo apt-get update && sudo apt-get install -y zsh)

    - name: Check formatting
      run: cargo fmt --check

    - name: Run clippy (including tests)
      run: cargo clippy --all-targets --locked -- -D warnings

    - name: Run tests
      run: cargo nextest run --locked

    - name: Check publishable
      if: runner.os == 'Linux'
      run: cargo publish --locked --dry-run

  docker-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Build clean-machine image and run the install journey
      run: |
        docker build -t pxh-e2e -f tests/docker/Dockerfile .
        docker run --rm pxh-e2e

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Install MSRV Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: "1.95"

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-msrv-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-msrv-

    - name: Install cargo-nextest
      uses: taiki-e/install-action@nextest

    - name: Ensure zsh is available
      run: which zsh || (sudo apt-get update && sudo apt-get install -y zsh)

    - name: Test with MSRV
      run: cargo nextest run --locked

  perf:
    name: Recall latency at 500k rows
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive

    - uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-perf-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-perf-

    - name: Install cargo-nextest
      uses: taiki-e/install-action@nextest

    - name: Run perf guard (release build, ignored-by-default tests)
      run: cargo nextest run --release --locked --run-ignored only --test perf_test --no-capture
