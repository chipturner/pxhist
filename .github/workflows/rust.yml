name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v6

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - uses: Swatinem/rust-cache@v2

    - name: Install cargo-nextest
      uses: taiki-e/install-action@nextest

    # Interactive tests drive real bash and zsh and fail (not skip) if absent.
    - name: Ensure zsh is available
      if: runner.os == 'Linux'
      run: which zsh || (sudo apt-get update && sudo apt-get install -y zsh)

    # Stock macOS bash is 3.2, which lacks READLINE_LINE; the Ctrl-R tests
    # need bash >= 4. Homebrew's bin precedes /bin on the runner PATH.
    - name: Ensure bash >= 4 is available
      if: runner.os == 'macOS'
      run: |
        brew list bash >/dev/null 2>&1 || brew install bash
        bash --version | head -1

    - name: Check formatting
      run: cargo fmt --check

    - name: Run clippy (including tests)
      run: cargo clippy --all-targets --locked -- -D warnings

    - name: Run tests
      run: cargo nextest run --locked

    - name: Check publishable
      if: runner.os == 'Linux'
      run: cargo publish --locked --dry-run

  docker-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v6

    - name: Build clean-machine image and run the install journey
      run: |
        docker build -t pxh-e2e -f tests/docker/Dockerfile .
        docker run --rm pxh-e2e

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v6

    - name: Install MSRV Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: "1.95"

    - uses: Swatinem/rust-cache@v2

    - name: Install cargo-nextest
      uses: taiki-e/install-action@nextest

    - name: Ensure zsh is available
      run: which zsh || (sudo apt-get update && sudo apt-get install -y zsh)

    - name: Test with MSRV
      run: cargo nextest run --locked

  perf:
    name: Recall latency at 500k rows
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v6

    - uses: dtolnay/rust-toolchain@stable

    - uses: Swatinem/rust-cache@v2

    - name: Install cargo-nextest
      uses: taiki-e/install-action@nextest

    - name: Run perf guard (release build, ignored-by-default tests)
      run: cargo nextest run --release --locked --run-ignored only --test perf_test --no-capture

  musl-build:
    name: Musl Release Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
    - uses: actions/checkout@v6

    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - uses: Swatinem/rust-cache@v2

    - uses: taiki-e/setup-cross-toolchain-action@v1
      with:
        target: ${{ matrix.target }}

    - name: Build
      run: cargo build --release --locked --target ${{ matrix.target }}

    - name: Verify static linkage
      run: |
        bin="target/${{ matrix.target }}/release/pxh"
        file "$bin"
        file "$bin" | grep -qE 'statically linked|static-pie linked' || {
          echo "error: $bin is not statically linked" >&2
          exit 1
        }
