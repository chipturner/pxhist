[package]
name = "pxh"
version = "0.10.4"
edition = "2024"
rust-version = "1.95"
authors = [ "Chip Turner <cturner@pattern.net>" ]
description = """
pxh is a fast, cross-shell history mining tool with interactive fuzzy search,
secret scanning, and bidirectional sync across machines. It indexes bash and
zsh history in SQLite with rich metadata for powerful recall."""
documentation = "https://chipturner.github.io/pxhist/docs/pxh/"
homepage = "https://github.com/chipturner/pxhist"
repository = "https://github.com/chipturner/pxhist"
keywords = ["shell", "history", "search", "bash", "zsh"]
categories = ["command-line-utilities"]
license = "MIT"
exclude = [
    ".cargo/",
    ".claude/",
    ".dockerignore",
    ".github/",
    ".gitmodules",
    "CLAUDE.md",
    "contrib/",
    "demo/",
    "deny.toml",
    "docs/",
    "install.sh",
    "justfile",
    "secrets-patterns-db/",
    "src/shell_configs/bash-preexec/",
    "tests/docker/",
]

[package.metadata.release]
publish = false

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/pxh-{ target }.tar.gz"
bin-dir = "pxh"
pkg-fmt = "tgz"

[lib]
path = "src/lib.rs"

[dependencies]
# Already linked in via clap; gives NO_COLOR / CLICOLOR / TERM=dumb handling and
# strips ANSI when stderr is not a terminal.
anstream = "1"
anyhow = "1"
bstr = { version = "1.13.1", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive", "env", "wrap_help"] }
log = "0.4.34"
env_logger = "0.11.11"
home = "0.5.12"
itertools = "0.15.0"
prettytable-rs = "0.10.0"
rand = "0.10.2"
chrono = "0.4.45"
uzers = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["arbitrary_precision"] }
regex = "1.13.1"
hostname = "0.4.2"
rusqlite = { version = "0.40.2", features = ["bundled", "functions"] }
tempfile = "3.27.0"
crossterm = { version = "0.29", features = ["use-dev-tty"] }
nucleo = "0.5"
toml = "1.1"
unicode-width = "0.2"
toml_edit = "0.25.13"
clap_complete = "4"
libc = "0.2"
clap_mangen = "0.3"

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml_ng = "0.10"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
which = "8.0"
rexpect = "0.7"
proptest = "1"
